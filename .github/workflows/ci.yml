name: CI

on:
  push:
    branches: [main, "jules/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage
        run: pytest --cov=raglens --cov-report=term-missing --cov-report=xml tests/

      - name: Evaluation smoke run (offline embedders)
        run: raglens eval --embedders lsa,hash --main-embedder lsa --chunk-sizes 512 --main-chunk-size 512 --out-dir /tmp/eval

      - name: Upload evaluation report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: /tmp/eval
