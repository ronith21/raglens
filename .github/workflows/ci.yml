name: CI

on:
  push:
    branches: [main, "jules/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage
        run: pytest --cov=raglens --cov-report=term-missing --cov-report=xml tests/

      - name: Evaluation smoke run
        env:
          USE_HASH_EMBEDDER: "true"
        run: python -m raglens.eval.benchmark --out ci-eval --chunk-sizes 512

      - name: Held-out banking smoke run
        env:
          USE_HASH_EMBEDDER: "true"
        run: |
          python -m raglens.eval.benchmark --corpus data/corpora/banking \
            --dataset data/eval/banking_test.jsonl --out ci-eval/banking --chunk-sizes 512 \
            --configs bm25,hybrid

      - name: Refusal gate trains reproducibly
        run: |
          python -m raglens.eval.train_gate --hash-embedder \
            --out ci-eval/refusal_gate.json --report ci-eval/gate_report.md

      - name: Upload coverage and eval report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-eval
          path: |
            coverage.xml
            ci-eval/

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: raglens:ci
      - name: Smoke-test container
        run: |
          docker run -d --name raglens -p 8000:8000 -e USE_HASH_EMBEDDER=true raglens:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"What is an inverted index?"}' | python -c "import json,sys; r=json.load(sys.stdin); assert r['citations'], r; print(r['answer'])"
          docker rm -f raglens
