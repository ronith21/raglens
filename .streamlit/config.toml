[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Defaults made explicit: Streamlit's own CSRF and CORS protection, and an upload cap that
# matches the API's MAX_UPLOAD_MB.
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 20
