services:
  api:
    build:
      context: .
      args:
        EXTRAS: ${RAGLENS_EXTRAS:-}
    image: raglens:latest
    env_file:
      - path: .env
        required: false
    environment:
      INDEX_DIR: /app/data/index
    ports:
      - "8000:8000"
    volumes:
      - raglens-index:/app/data/index
    restart: unless-stopped

  ui:
    image: raglens:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    command:
      - streamlit
      - run
      - src/raglens/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    healthcheck:
      disable: true
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  raglens-index:
