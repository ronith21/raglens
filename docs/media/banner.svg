      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#14396b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#2f7de1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g opacity="0.10" fill="#ffffff">
    <rect x="760" y="52" width="360" height="14" rx="7"/>
    <rect x="760" y="80" width="300" height="14" rx="7"/>
    <rect x="760" y="108" width="340" height="14" rx="7"/>
    <rect x="760" y="136" width="250" height="14" rx="7"/>
    <rect x="760" y="164" width="330" height="14" rx="7"/>
