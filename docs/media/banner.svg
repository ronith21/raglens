  <line x1="1012" y1="172" x2="1072" y2="232" stroke="url(#lens)" stroke-width="22" stroke-linecap="round"/>
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff">RAGLens</text>
