[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raglens"
version = "0.2.0"
description = "Retrieval-Augmented Generation system with a built-in evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "RAGLens Contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.25.0",
    "httpx>=0.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "fastapi-offline>=1.7.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
models = [
    "sentence-transformers>=2.2.0",
]
screenshots = [
    "playwright>=1.40.0",
]
train = [
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "pandas-stubs>=2.0.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
raglens = "raglens.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # do not perform function calls in argument defaults (Typer/FastAPI idiom)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "rank_bm25.*",
    "pypdf.*",
    "streamlit.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
filterwarnings = [
    "error",
    # Starlette's TestClient warns about its own httpx dependency; nothing to fix on our side.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/raglens"]
omit = [
    "*/ui/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 85
